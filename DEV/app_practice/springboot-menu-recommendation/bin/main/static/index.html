<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐 먹지? - SKALA</title>
    <style>
        :root {
            --bg: #0a0a0d;
            --panel: #121218;
            --panel-2: #181822;
            --line: rgba(255, 255, 255, 0.08);
            --line-strong: rgba(255, 255, 255, 0.2);
            --text: #f3f4f6;
            --text-dim: #9ca3af;
            --text-soft: #e5e7eb;
            --brand-1: #d9232a;
            --brand-2: #ea5404;
            --brand-hover-1: #b81c22;
            --brand-hover-2: #d04800;
            --accent: #f97316;
            --btn-bg: #1f1f2c;
            --btn-bg-hover: #2a2a3c;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: start center;
            font-family: "Pretendard Variable", -apple-system, "Apple SD Gothic Neo", "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(1100px 500px at 15% -10%, rgba(217, 35, 42, 0.10), transparent 60%),
                radial-gradient(900px 500px at 100% 0%, rgba(234, 84, 4, 0.08), transparent 55%),
                var(--bg);
            color: var(--text);
            padding: 56px 20px 80px;
        }

        main {
            width: min(820px, 94vw);
        }

        /* ---------- 상단 브랜드 바 ---------- */
        .brandbar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
        }
        .brandbar .mark {
            width: 26px;
            height: 26px;
            border-radius: 7px;
            background: linear-gradient(135deg, var(--brand-1), var(--brand-2));
            box-shadow: 0 3px 10px rgba(234, 84, 4, 0.4);
            flex-shrink: 0;
        }
        .brandbar .word {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.16em;
            color: var(--text-soft);
            text-transform: uppercase;
        }
        .brandbar .word span { color: var(--accent); }
        .brandbar .rule {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--line-strong), transparent);
        }

        /* ---------- 카드 컨테이너 ---------- */
        .surface {
            background: var(--panel);
            border-radius: 20px;
            border: 1px solid var(--line);
            box-shadow: 0 0 30px rgba(234, 84, 4, 0.15);
            padding: 40px 40px 36px;
        }

        header.intro h1 {
            margin: 0;
            font-size: 28px;
            line-height: 1.3;
            color: #ffffff;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        header.intro p {
            margin: 10px 0 0;
            font-size: 14.5px;
            line-height: 1.6;
            color: var(--text-dim);
        }

        /* ---------- 섹션 헤더 ---------- */
        .section { margin-top: 40px; }
        .section-head {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 4px;
        }
        .section-head .eyebrow {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.14em;
            color: var(--text-dim);
            text-transform: uppercase;
        }
        .section-head h2 {
            margin: 0;
            font-size: 17px;
            font-weight: 700;
            color: var(--text-soft);
        }
        .badge {
            padding: 3px 10px;
            border-radius: 999px;
            background: rgba(234, 84, 4, 0.15);
            color: var(--accent);
            font-size: 11px;
            font-weight: 800;
            border: 1px solid rgba(249, 115, 22, 0.3);
            letter-spacing: 0.02em;
        }

        /* ---------- 기본 기능 그리드 ---------- */
        .buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        button {
            font-family: inherit;
            border: 0;
            cursor: pointer;
        }

        .plain-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 14px;
            border-radius: 12px;
            background: var(--btn-bg);
            color: var(--text);
            font-size: 14.5px;
            font-weight: 600;
            width: 100%;
            border: 1px solid var(--line);
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }
        .plain-btn:hover {
            background: var(--btn-bg-hover);
            border-color: var(--line-strong);
            transform: translateY(-1px);
        }
        .plain-btn .ic { font-size: 15px; }

        /* ---------- 실습과제 카드 통일 디자인 ---------- */
        .task-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 14px;
            margin-top: 20px;
            align-items: stretch;
        }

        .task-card {
            grid-column: span 1;
            background: linear-gradient(135deg, var(--brand-1), var(--brand-2));
            border-radius: 14px;
            padding: 16px 16px 14px;
            box-shadow: 0 4px 15px rgba(234, 84, 4, 0.35);
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: box-shadow 0.25s ease, transform 0.25s ease;
        }
        .task-card:hover {
            box-shadow: 0 6px 20px rgba(234, 84, 4, 0.55);
            transform: translateY(-2px);
        }

        .task-card .row-top {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .task-card .num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 22px;
            height: 22px;
            padding: 0 6px;
            border-radius: 7px;
            background: rgba(0, 0, 0, 0.28);
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.02em;
        }
        .task-card .name {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.01em;
        }

        .card-inputs {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.9);
            width: 100%;
            background: rgba(0, 0, 0, 0.25);
            padding: 8px 10px;
            border-radius: 10px;
            flex-wrap: wrap;
        }
        .card-inputs select {
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            outline: none;
            text-align: center;
            font-family: inherit;
            width: 100%;
        }
        .card-inputs select option {
            background: #121218;
            color: #ffffff;
        }

        /* 🎮 게임 스탯 스타일 가격 컨트롤러 */
        .game-price-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }
        .price-badge-display {
            font-size: 11.5px;
            font-weight: 800;
            color: #ffd000;
            text-align: center;
            letter-spacing: 0.05em;
            background: rgba(0,0,0,0.4);
            padding: 3px 6px;
            border-radius: 6px;
            border: 1px solid rgba(255, 208, 0, 0.3);
        }
        .game-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(255,255,255,0.25);
            outline: none;
            cursor: pointer;
        }
        .game-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        .game-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: #ffd000;
        }
        .preset-btns {
            display: flex;
            justify-content: space-between;
            gap: 3px;
            margin-top: 2px;
        }
        .preset-btn {
            font-size: 10px;
            padding: 2px 5px;
            border-radius: 4px;
            background: rgba(0,0,0,0.3);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.15);
            cursor: pointer;
        }
        .preset-btn:hover { background: rgba(0,0,0,0.6); }

        .task-card .run-btn {
            margin-top: auto;
            width: 100%;
            padding: 9px 10px;
            border-radius: 9px;
            background: rgba(0, 0, 0, 0.28);
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            border: 1px solid rgba(255,255,255,0.16);
            transition: background 0.2s ease;
        }
        .task-card .run-btn:hover {
            background: rgba(0, 0, 0, 0.42);
        }

        /* ---------- 결과 패널 ---------- */
        .result-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 34px;
            margin-bottom: 8px;
        }
        .result-head span {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.12em;
            color: var(--text-dim);
            text-transform: uppercase;
        }
        .result-head .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--brand-2);
            display: inline-block;
            margin-right: 6px;
            box-shadow: 0 0 8px rgba(234, 84, 4, 0.7);
        }

        #result {
            min-height: 95px;
            padding: 20px;
            border-radius: 14px;
            background: var(--panel-2);
            border: 1px solid rgba(234, 84, 4, 0.25);
            box-shadow: inset 0 0 12px rgba(234, 84, 4, 0.08);
            white-space: pre-wrap;
            word-break: break-word;
            color: var(--text);
            font-size: 14px;
            font-family: "SF Mono", "Menlo", monospace;
            line-height: 1.55;
        }

        footer.foot {
            margin-top: 26px;
            text-align: center;
            font-size: 11.5px;
            color: var(--text-dim);
            letter-spacing: 0.02em;
        }

        @media (max-width: 520px) {
            .surface { padding: 28px 22px 26px; }
            header.intro h1 { font-size: 23px; }
        }
    </style>
</head>
<body>
<main>
    <div class="brandbar">
        <div class="mark"></div>
        <div class="word">SKALA <span>DEV LAB (practice)</span></div>
        <div class="rule"></div>
    </div>

    <div class="surface">
        <header class="intro">
            <h1>🍽️ 오늘 뭐 먹지?</h1>
            <p>조회 버튼을 누르면 메뉴를 확인할 수 있습니다!</p>
        </header>

        <section class="section">
            <div class="section-head">
                <span class="eyebrow">Step 1</span>
                <h2>기본 기능</h2>
            </div>

            <div class="buttons">
                <button class="plain-btn" data-url="/api/menu"><span class="ic">🎲</span>기본 추천</button>
                <button class="plain-btn" data-url="/api/menu/random"><span class="ic">🔀</span>랜덤 추천</button>
                <button class="plain-btn" data-url="/api/menu/korean"><span class="ic">🍚</span>한식 추천</button>
                <button class="plain-btn" data-url="/api/menu/chinese"><span class="ic">🥢</span>중식 추천</button>
                <button class="plain-btn" data-url="/api/menu/japanese"><span class="ic">🍣</span>일식 추천</button>
                <button class="plain-btn" data-url="/api/menu/json/korean"><span class="ic">{ }</span>JSON 응답</button>
            </div>
        </section>

        <section class="section">
            <div class="section-head">
                <span class="eyebrow">Step 2</span>
                <h2>실습과제</h2>
                <span class="badge">직접 만들기</span>
            </div>

            <div class="task-grid">
                <!-- ① 날씨별 추천 (드롭다운) -->
                <div class="task-card">
                    <div class="row-top">
                        <span class="num">01</span>
                        <span class="name">날씨별 추천</span>
                    </div>
                    <div class="card-inputs">
                        <select id="weatherSelect">
                            <option value="rainy">비 오는 날 (rainy)</option>
                            <option value="sunny">맑은 날 (sunny)</option>
                            <option value="hot">더운 날 (hot)</option>
                            <option value="cold">추운 날 (cold)</option>
                        </select>
                    </div>
                    <button class="run-btn" id="weatherSearchBtn">조회</button>
                </div>

                <!-- ② 기분별 추천 (드롭다운) -->
                <div class="task-card">
                    <div class="row-top">
                        <span class="num">02</span>
                        <span class="name">기분별 추천</span>
                    </div>
                    <div class="card-inputs">
                        <select id="moodSelect">
                            <option value="happy">신남/행복 (happy)</option>
                            <option value="sad">우울/슬픔 (sad)</option>
                            <option value="tired">피곤/지침 (tired)</option>
                            <option value="stressed">스트레스 (stressed)</option>
                        </select>
                    </div>
                    <button class="run-btn" id="moodSearchBtn">조회</button>
                </div>

                <!-- ③ 가격대별 추천 (🎮 게임 게이지 스타일) -->
                <div class="task-card">
                    <div class="row-top">
                        <span class="num">03</span>
                        <span class="name">가격대 조절</span>
                    </div>
                    <div class="card-inputs">
                        <div class="game-price-box">
                            <div class="price-badge-display" id="priceDisplay">5,000원 ~ 10,000원</div>
                            <input type="range" class="game-slider" id="maxPriceSlider" min="3000" max="30000" step="1000" value="10000">
                            <div class="preset-btns">
                                <button class="preset-btn" onclick="setPricePreset(0, 6000)">6천원 이하</button>
                                <button class="preset-btn" onclick="setPricePreset(5000, 12000)">1.2만원 이하</button>
                                <button class="preset-btn" onclick="setPricePreset(10000, 25000)">고급 요리</button>
                            </div>
                        </div>
                    </div>
                    <button class="run-btn" id="priceSearchBtn">조회</button>
                </div>

                <!-- ④ 나만의 맞춤 추천 -->
                <div class="task-card">
                    <div class="row-top">
                        <span class="num">04</span>
                        <span class="name">나만의 맞춤 추천</span>
                    </div>
                    <div class="card-inputs" style="border-radius: 8px;">
                        <select id="companion" style="width: auto;">
                            <option value="solo">혼밥</option>
                            <option value="friends">친구</option>
                            <option value="family">가족</option>
                        </select>
                        <select id="time" style="width: auto;">
                            <option value="10min">10분</option>
                            <option value="30min" selected>30분</option>
                            <option value="60min">넉넉함</option>
                        </select>
                        <select id="season" style="width: auto;">
                            <option value="summer">여름</option>
                            <option value="winter">겨울</option>
                        </select>
                    </div>
                    <button class="run-btn" id="customSearchBtn">조회</button>
                </div>
            </div>
        </section>

        <div class="result-head">
            <span><span class="dot"></span>Response</span>
        </div>
        <div id="result">결과가 여기에 표시됩니다.</div>
    </div>

    <footer class="foot">SKALA · Spring Boot REST API 실습</footer>
</main>

<script>
    const result = document.getElementById("result");

    let currentMin = 0;
    let currentMax = 10000;

    const slider = document.getElementById("maxPriceSlider");
    const priceDisplay = document.getElementById("priceDisplay");

    slider?.addEventListener("input", (e) => {
        currentMax = parseInt(e.target.value);
        currentMin = Math.max(0, currentMax - 5000);
        updatePriceDisplay();
    });

    function setPricePreset(min, max) {
        currentMin = min;
        currentMax = max;
        slider.value = max;
        updatePriceDisplay();
    }

    function updatePriceDisplay() {
        priceDisplay.textContent = `${currentMin.toLocaleString()}원 ~ ${currentMax.toLocaleString()}원`;
    }

// 공통 API Fetch (에러 처리 및 카카오맵 매장 찾기 완벽 대응)
    async function fetchApi(url, taskNum) {
        result.textContent = "요청 중...";
        try {
            const response = await fetch(url);
            const contentType = response.headers.get("content-type") ?? "";

            if (response.status === 404 && taskNum) {
                result.textContent = `아직 만들지 않은 API입니다. (실습과제 ${taskNum}번)\n\n요청한 주소: GET ${url}`;
                return;
            }

            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            let menuName = "";
            let responseText = "";

            if (contentType.includes("application/json")) {
                const data = await response.json();
                // JSON 형태 응답일 때 (menu 필드 우선 추출)
                menuName = data.menu || data.category || "메뉴";
                responseText = JSON.stringify(data, null, 2);
            } else {
                responseText = await response.text();
                // 텍스트 형태 응답일 때 (메뉴명만 정교하게 추출)
                const match = responseText.match(/([가-힣a-zA-A0-9\s&]+?)(?:입니다|어떠세요|\?|$)/);
                if (match) {
                    menuName = match[1].replace(/.*(추천 메뉴는|오늘은)\s*/, "").trim();
                } else {
                    menuName = responseText.trim();
                }
            }

            // 검색용 메뉴명이 너무 길거나 비어있을 때 예외 처리
            if (!menuName || menuName.length > 20) {
                menuName = "오늘의 추천 메뉴";
            }

            const mapSearchUrl = `https://map.kakao.com/?q=${encodeURIComponent(menuName)}`;
                        
            result.innerHTML = `<pre style="margin: 0; font-family: inherit; font-size: 14px;">${responseText}</pre>` + 
                `<div style="margin-top: 14px; border-top: 1px dashed rgba(255,255,255,0.15); padding-top: 12px;">` +
                `  <a href="${mapSearchUrl}" target="_blank" style="display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; background: #fee500; color: #191919; border-radius: 8px; font-size: 12.5px; font-weight: bold; text-decoration: none; box-shadow: 0 2px 8px rgba(0,0,0,0.3);">` +
                `    📍 카카오맵에서 '${menuName}' 매장 찾기 ↗` +
                `  </a>` +
                `</div>`;
        } catch (error) {
            result.textContent = `오류: ${error.message}`;
        }
    }

    // Step 1: 기본 API 버튼 처리
    document.querySelectorAll(".plain-btn").forEach((button) => {
        button.addEventListener("click", () => fetchApi(button.dataset.url));
    });

    // ① 날씨별 추천
    document.getElementById("weatherSearchBtn")?.addEventListener("click", () => {
        const weather = document.getElementById("weatherSelect").value;
        fetchApi(`/api/menu/weather/${weather}`, 1);
    });

    // ② 기분별 추천
    document.getElementById("moodSearchBtn")?.addEventListener("click", () => {
        const mood = document.getElementById("moodSelect").value;
        fetchApi(`/api/menu/mood/${mood}`, 2);
    });

    // ③ 가격대별 추천
    document.getElementById("priceSearchBtn")?.addEventListener("click", () => {
        fetchApi(`/api/menu/price/search?min=${currentMin}&max=${currentMax}`, 3);
    });

    // ④ 나만의 추천
    document.getElementById("customSearchBtn")?.addEventListener("click", () => {
        const companion = document.getElementById("companion")?.value || "solo";
        const time = document.getElementById("time")?.value || "30min";
        const season = document.getElementById("season")?.value || "summer";
        fetchApi(`/api/menu/my/custom?companion=${companion}&time=${time}&season=${season}`, 4);
    });
</script>
</body>
</html>
