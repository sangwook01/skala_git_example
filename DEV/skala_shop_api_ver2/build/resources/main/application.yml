server:
  port: 8080

spring:
  application:
    name: skala-shop-api

  datasource:
    url: jdbc:h2:mem:shopdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    # Hibernate가 스키마를 먼저 생성한 뒤 data.sql이 실행되도록 지연 초기화
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

jwt:
  secret: skala-shop-api-secret-key-must-be-long-enough-000000
  expiration-millis: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.sk.skala.shopapi: debug
