server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # SPA 라우팅 (이 설정이 이번 배포의 핵심)
    #
    # Vue Router 는 createWebHistory 를 쓰므로 주소가 /rank, /about 처럼 보인다.
    # 하지만 서버에는 그런 이름의 파일이 없기 때문에, 사용자가 /rank 로
    # 직접 접속하거나 새로고침하면 nginx 는 404 를 반환한다.
    #
    # try_files 로 "파일을 못 찾으면 index.html 을 대신 주도록" 하면
    # 앱이 뜬 뒤 Vue Router 가 주소를 보고 알맞은 화면을 그린다.
    #
    # ver4에서 만든 Catch-all Route 는 앱이 이미 떠 있을 때 동작하는 것이고,
    # 이 설정은 그 앱을 띄워주는 단계의 문제라 층위가 다르다.
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------------
    # 정적 자산 캐싱
    #
    # Vite 는 빌드 시 파일명에 해시를 붙인다 (index-hkOuYOvA.js).
    # 내용이 바뀌면 파일명도 바뀌므로 오래 캐싱해도 안전하다.
    # ------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 은 해시가 없으므로 캐싱하지 않는다.
    # 캐싱하면 새로 배포해도 예전 화면이 계속 보인다.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ------------------------------------------------------------------
    # 전송 압축
    # ------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # 서버 버전 노출 방지
    server_tokens off;
}
