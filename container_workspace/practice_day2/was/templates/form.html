{% extends "base.html" %}
{% block title %}{% if mode == 'edit' %}글 수정{% else %}글쓰기{% endif %}{% endblock %}

{% block content %}

<div class="card">
  <h2>{% if mode == 'edit' %}글 수정{% else %}글쓰기{% endif %}</h2>

  {# 같은 템플릿으로 작성과 수정을 모두 처리한다. 보내는 주소만 달라진다. #}
  <form method="post"
        action="{% if mode == 'edit' %}{{ url_for('update_post', post_id=post.id) }}{% else %}{{ url_for('create_post') }}{% endif %}">

    <div class="row">
      <div>
        <label for="author">작성자</label>
        <input id="author" name="author" maxlength="50" required
               value="{{ post.author if post else '' }}" placeholder="김상욱" />
      </div>
      <div>
        <label for="title">제목</label>
        <input id="title" name="title" maxlength="200" required
               value="{{ post.title if post else '' }}" placeholder="첫 번째 글" />
      </div>
    </div>

    <label for="content">내용</label>
    <textarea id="content" name="content" required
              placeholder="내용을 입력하세요">{{ post.content if post else '' }}</textarea>

    <div class="actions">
      <button class="btn" type="submit">
        {% if mode == 'edit' %}수정하기{% else %}저장하기{% endif %}
      </button>
      <a class="btn ghost"
         href="{% if mode == 'edit' %}{{ url_for('detail_page', post_id=post.id) }}{% else %}{{ url_for('list_page') }}{% endif %}">취소</a>
    </div>
  </form>
</div>

{% endblock %}
