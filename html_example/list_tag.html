<!DOCTYPE html>
<html>
        <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>HTML 목록태그 예제</title>
        </head>
            
        <body>
            <h2> 좋아하는 과일 </h2>
            <ul style="list-style-type:disc;">
                <li>사과</li>
                <li>바나나</li>
                <li>오렌지</li>
            </ul>

            <h2>웹 페이지 제작 순서 </h2>
            <ol type="1">
                <li>html 작성</li>
                <li>css 적용</li>
                <li>javascript 추가</li>    
            </ol>

            <h2>HTML 용어</h2>
            <dl>
                <dt>HTML</dt>
                <dd> Hypertext Markup Language, 웹 페이지를 만드는 데 사용되는 마크업 언어입니다.</dd>
                <dt>CSS</dt>
                <dd> Cascading Style Sheets, 웹 페이지의 스타일을 정의하는 언어입니다.</dd>
                <dt></dt>JavaScript</dt>
                <dd> 웹 페이지의 동적인 기능을 구현하는 프로그래밍 언어입니다.</dd>
            </dl>


        </body>
</html>
