$kind: http-request
name: 1-1. 상품 목록 조회 (GET /api/products)
url: "{{baseUrl}}/api/products?offset=0&count=10"
method: GET
queryParams:
  offset: "0"
  count: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test('상태 200 OK', function () {
          pm.response.to.have.status(200);
      });
      pm.test('페이징 데이터 구조 확인', function () {
          const json = pm.response.json();
          pm.expect(json.data).to.have.property('content');
          pm.expect(json.data.content).to.be.an('array');
      });
      pm.test('시드 데이터(무선마우스 등) 최소 3건 존재', function () {
          const json = pm.response.json();
          pm.expect(json.data.content.length).to.be.at.least(3);
      });
    language: text/javascript
order: 1000
