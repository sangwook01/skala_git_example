$kind: http-request
name: 1-2. 상품 목록 조회 (GET /api/products/list, 경로 호환 확인)
url: "{{baseUrl}}/api/products/list?offset=0&count=10"
method: GET
queryParams:
  offset: "0"
  count: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test('상태 200 OK (경로 호환 확인: /list)', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 2000
