$kind: http-request
url: "{{baseUrl}}/api/products/1"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('상태 200 OK', function () {
          pm.response.to.have.status(200);
      });
      pm.test('상품명이 무선마우스', function () {
          const json = pm.response.json();
          pm.expect(json.data.productName).to.eql('무선마우스');
      });
    language: text/javascript
order: 3000
