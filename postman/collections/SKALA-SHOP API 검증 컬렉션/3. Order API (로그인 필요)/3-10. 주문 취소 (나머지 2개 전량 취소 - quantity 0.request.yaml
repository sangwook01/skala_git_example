$kind: http-request
name: 3-10. 주문 취소 (나머지 2개 전량 취소 - quantity 0되면 항목 삭제 확인)
url: "{{baseUrl}}/api/customers/cancel"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "productId": 1,
      "quantity": 2
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('상태 200 OK', function () {
          pm.response.to.have.status(200);
      });
      pm.test('나머지 2개 전량 취소 -> 1000000 전액 환급', function () {
          const json = pm.response.json();
          pm.expect(json.data).to.include('1000000');
      });
    language: text/javascript
order: 10000
