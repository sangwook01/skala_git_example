$kind: http-request
url: "{{baseUrl}}/api/customers/order"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "productId": 3,
      "quantity": 1000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('포인트 부족 -> 400 INSUFFICIENT_FUNDS', function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 6000
