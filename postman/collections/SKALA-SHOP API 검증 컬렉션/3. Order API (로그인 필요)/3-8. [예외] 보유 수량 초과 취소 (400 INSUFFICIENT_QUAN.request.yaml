$kind: http-request
name: 3-8. [예외] 보유 수량 초과 취소 (400 INSUFFICIENT_QUANTITY)
url: "{{baseUrl}}/api/customers/cancel"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "productId": 1,
      "quantity": 999
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('보유 수량보다 많은 취소 -> 400 INSUFFICIENT_QUANTITY', function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 8000
