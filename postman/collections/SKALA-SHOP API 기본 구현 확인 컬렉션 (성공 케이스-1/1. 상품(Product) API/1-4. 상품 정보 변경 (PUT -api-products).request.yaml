$kind: http-request
name: 1-4. 상품 정보 변경 (PUT /api/products)
url: "{{baseUrl}}/api/products"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id": "{{newProductId}}",
      "productName": "기계식키보드(적축)",
      "productPrice": 95000
    }
scripts:
  - type: beforeRequest
    code: |-
      const id = pm.collectionVariables.get('newProductId');
      let body = JSON.parse(pm.request.body.raw);
      body.id = Number(id);
      pm.request.body.update({mode: 'raw', raw: JSON.stringify(body)});
    language: text/javascript
  - type: afterResponse
    code: pm.test('상태 200 확인', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 7000
