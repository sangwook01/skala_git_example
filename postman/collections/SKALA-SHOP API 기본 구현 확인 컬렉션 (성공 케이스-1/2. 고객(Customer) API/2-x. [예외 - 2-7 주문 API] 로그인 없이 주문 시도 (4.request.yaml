$kind: http-request
name: 2-x. [예외 - 2-7 주문 API] 로그인 없이 주문 시도 (401 UNAUTHORIZED)
url: "{{baseUrl}}/api/customers/order"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "productId": 1,
      "quantity": 1
    }
scripts:
  - type: afterResponse
    code: pm.test('로그인 전 주문 시도 -> 401 UNAUTHORIZED', function () { pm.response.to.have.status(401); });
    language: text/javascript
order: 4000
