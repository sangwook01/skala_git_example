$kind: http-request
name: 1-3. 상품 정보 추가 (POST /api/products)
url: "{{baseUrl}}/api/products"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "productName": "기계식키보드",
      "productPrice": 89000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('상태 200 OK', function () { pm.response.to.have.status(200); });
      const json = pm.response.json();
      pm.collectionVariables.set('newProductId', json.data.id);
    language: text/javascript
order: 3000
