$kind: http-request
name: 1-5. 상품 정보 삭제 (DELETE /api/products)
url: "{{baseUrl}}/api/products"
method: DELETE
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id": "{{newProductId}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      const id = pm.collectionVariables.get('newProductId');
      let body = JSON.parse(pm.request.body.raw);
      body.id = Number(id);
      pm.request.body.update({mode: 'raw', raw: JSON.stringify(body)});
    language: text/javascript
  - type: afterResponse
    code: pm.test('상태 200 OK', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 5000
