$kind: http-request
name: 3-1. 특별할인 등록 (POST /api/promotions/discounts)
url: "{{baseUrl}}/api/promotions/discounts"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "productId": 2,
      "discountRate": 0.2,
      "startAt": "__S__",
      "endAt": "__E__"
    }
scripts:
  - type: beforeRequest
    code: |-
      function toLocalIso(date) {
          const pad = n => String(n).padStart(2, '0');
          return date.getFullYear() + '-' + pad(date.getMonth()+1) + '-' + pad(date.getDate())
              + 'T' + pad(date.getHours()) + ':' + pad(date.getMinutes()) + ':' + pad(date.getSeconds());
      }
      const now = new Date();
      const start = new Date(now.getTime() - 24*60*60*1000);
      const end = new Date(now.getTime() + 365*24*60*60*1000);
      let body = JSON.parse(pm.request.body.raw);
      body.startAt = toLocalIso(start);
      body.endAt = toLocalIso(end);
      pm.request.body.update({mode: 'raw', raw: JSON.stringify(body)});
    language: text/javascript
  - type: afterResponse
    code: pm.test('상태 200 OK', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 1000
