$kind: http-request
name: 3-4. 선착순 이벤트 등록 (POST /api/promotions/events)
url: "{{baseUrl}}/api/promotions/events"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "productId": 3,
      "eventPrice": 10000,
      "totalQuantity": 5,
      "startAt": "__S__",
      "endAt": "__E__"
    }
scripts:
  - type: beforeRequest
    code: |-
      function toLocalIso(date) {
          const pad = n => String(n).padStart(2, '0');
          return date.getFullYear() + '-' + pad(date.getMonth()+1) + '-' + pad(date.getDate())
              + 'T' + pad(date.getHours()) + ':' + pad(date.getMinutes()) + ':' + pad(date.getSeconds());
      }
      const now = new Date();
      const start = new Date(now.getTime() - 24*60*60*1000);
      const end = new Date(now.getTime() + 365*24*60*60*1000);
      let body = JSON.parse(pm.request.body.raw);
      body.startAt = toLocalIso(start);
      body.endAt = toLocalIso(end);
      pm.request.body.update({mode: 'raw', raw: JSON.stringify(body)});
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('상태 200 OK', function () { pm.response.to.have.status(200); });
      const json = pm.response.json();
      pm.collectionVariables.set('flashEventId', json.data.id);
    language: text/javascript
order: 4000
